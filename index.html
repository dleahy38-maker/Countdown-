<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Countdown</title>

<!-- iOS: run full-screen when added to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<!-- Android/Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2226">

<!-- Home screen icons + manifest (enables Android/Chrome "Install app") -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo:wght@500;600;700;800&display=swap');

  :root{
    --steel:#1c2226;
    --steel-2:#2a3238;
    --tape-yellow:#e8b73a;
    --chalk:#eef0ee;
    --line:#3c464c;
    --ok:#7fae7a;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 40px),
      linear-gradient(180deg, var(--steel) 0%, #14181b 100%);
    color:var(--chalk);
    font-family:'Archivo', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .rig{
    width:min(92vw, 620px);
    padding:44px 40px 36px;
    background:var(--steel-2);
    border:1px solid var(--line);
    border-radius:6px;
    position:relative;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* bolt marks, corner rivets */
  .rig::before, .rig::after{
    content:'';
    position:absolute;
    width:9px;height:9px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #6a747a, #1c2226 70%);
    top:14px;
  }
  .rig::before{ left:14px; }
  .rig::after{ right:14px; }
  .rivet-bl, .rivet-br{
    content:'';
    position:absolute;
    width:9px;height:9px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #6a747a, #1c2226 70%);
    bottom:14px;
  }
  .rivet-bl{ left:14px; }
  .rivet-br{ right:14px; }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--tape-yellow);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .eyebrow::after{
    content:'';
    flex:1;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);
  }

  h1{
    font-family:'Archivo', sans-serif;
    font-weight:800;
    font-size:clamp(20px, 4vw, 26px);
    margin:0 0 26px;
    letter-spacing:-0.01em;
  }
  h1 span{ color:var(--tape-yellow); }

  .readout{
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    align-items:stretch;
    gap:0 26px;
    margin:8px 0 30px;
  }
  .divider{ background:var(--line); }

  .metric{ text-align:left; }
  .metric .num{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(48px, 11vw, 72px);
    line-height:1;
    color:var(--chalk);
    font-variant-numeric:tabular-nums;
  }
  .metric.sundays .num{ color:var(--ok); }
  .metric .label{
    margin-top:10px;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8a959b;
    font-family:'Space Mono', monospace;
  }

  /* tape measure progress bar */
  .tape{
    position:relative;
    height:30px;
    background:var(--steel);
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .tape-fill{
    position:absolute;
    inset:0;
    width:0%;
    background:linear-gradient(90deg, #5d7a58, var(--ok));
    transition:width 1s ease;
  }
  .tape-marks{
    position:absolute;
    inset:0;
    display:flex;
  }
  .tape-marks span{
    flex:1;
    border-right:1px solid rgba(0,0,0,0.25);
  }
  .tape-marks span:nth-child(10n){
    border-right:1px solid rgba(255,255,255,0.18);
  }
  .tape-label{
    position:relative;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#8a959b;
  }

  .foot{
    margin-top:24px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#5c666c;
    display:flex;
    justify-content:space-between;
  }

  @media (prefers-reduced-motion: reduce){
    .tape-fill{ transition:none; }
  }
</style>
</head>
<body>

<div class="rig">
  <div class="rivet-bl"></div><div class="rivet-br"></div>
  <div class="eyebrow">Site countdown</div>
  <h1>Days to <span>3 Dec 2026</span></h1>

  <div class="readout">
    <div class="metric">
      <div class="num" id="daysNum">–</div>
      <div class="label">Days remaining</div>
    </div>
    <div class="divider"></div>
    <div class="metric sundays">
      <div class="num" id="sundaysNum">–</div>
      <div class="label">Sundays remaining</div>
    </div>
  </div>

  <div class="tape">
    <div class="tape-fill" id="tapeFill"></div>
    <div class="tape-marks" id="tapeMarks"></div>
  </div>
  <div class="tape-label">
    <span id="todayLabel">Today</span>
    <span>3 Dec 2026</span>
  </div>

  <div class="foot">
    <span id="clock">--:--:--</span>
    <span>Refreshes live</span>
  </div>
</div>

<script>
  const target = new Date(2026, 11, 3, 0, 0, 0);

  function startOfDay(d){
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function countSundays(from, to){
    // counts Sundays strictly after 'from' up to and including 'to'
    let count = 0;
    let d = new Date(from);
    d.setDate(d.getDate() + 1);
    while(d <= to){
      if(d.getDay() === 0) count++;
      d.setDate(d.getDate() + 1);
    }
    return count;
  }

  function render(){
    const now = new Date();
    const today = startOfDay(now);
    const tgt = startOfDay(target);

    const msPerDay = 24*60*60*1000;
    const daysLeft = Math.max(0, Math.round((tgt - today) / msPerDay));
    const sundaysLeft = daysLeft > 0 ? countSundays(today, tgt) : 0;

    document.getElementById('daysNum').textContent = daysLeft;
    document.getElementById('sundaysNum').textContent = sundaysLeft;

    // progress bar: assume a rolling ~180 day horizon for visual scale, capped
    const horizon = 214; // days between Jul 8 2026 and Dec 3 2026 approx, fixed reference
    const totalSpan = Math.round((tgt - new Date(2026,6,8)) / msPerDay) || horizon;
    const elapsed = totalSpan - daysLeft;
    const pct = Math.min(100, Math.max(0, (elapsed/totalSpan)*100));
    document.getElementById('tapeFill').style.width = pct + '%';

    document.getElementById('todayLabel').textContent =
      today.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'});

    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-AU', {hour12:false});
  }

  // tick marks
  const marks = document.getElementById('tapeMarks');
  for(let i=0;i<40;i++){
    const s = document.createElement('span');
    marks.appendChild(s);
  }

  render();
  setInterval(render, 1000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>

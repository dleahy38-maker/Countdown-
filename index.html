<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>SITE LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15161A;
    --surface: #202226;
    --surface-raised: #26282E;
    --hairline: #34363C;
    --text: #EDEDE8;
    --text-muted: #8B8D93;
    --amber: #F5A623;
    --amber-dim: #5B4420;
    --red: #E4572E;
    --red-dim: #4A2620;
    --blue: #4A7A96;
    --blue-dim: #223038;
    --done: #4B4D53;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* HEADER */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--hairline);
    padding-bottom: 14px;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  header .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* CAPTURE */
  .capture {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 14px;
  }
  .capture .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .capture .hint svg { flex-shrink: 0; opacity: 0.6; }

  textarea {
    width: 100%;
    min-height: 84px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 12px;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: var(--amber); }
  textarea::placeholder { color: var(--text-muted); }

  .log-btn {
    width: 100%;
    margin-top: 10px;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: var(--amber);
    color: #15161A;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .log-btn:active { transform: scale(0.98); }
  .log-btn:disabled { background: var(--hairline); color: var(--text-muted); cursor: default; }

  /* LIST */
  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .category-filter {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 6px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .category-filter::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--hairline);
    color: var(--text-muted);
    background: var(--surface);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active {
    border-color: var(--amber);
    color: var(--amber);
    background: var(--amber-dim);
  }
  .chip:active { transform: scale(0.96); }

  .view-tabs {
    display: flex;
    gap: 8px;
  }
  .view-tabs .chip {
    flex: 1;
    text-align: center;
    white-space: normal;
  }

  .task {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-left: 4px solid var(--done);
    border-radius: 8px;
    padding: 12px 12px 12px 14px;
    overflow: hidden;
  }
  .task::before {
    /* perforated top edge, docket feel */
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background-image: repeating-linear-gradient(90deg, var(--hairline) 0 4px, transparent 4px 8px);
  }
  .task.p-high { border-left-color: var(--red); }
  .task.p-medium { border-left-color: var(--amber); }
  .task.p-low { border-left-color: var(--blue); }
  .task.done { opacity: 0.45; }
  .task.cached { opacity: 0.7; border-style: dashed; border-left-style: solid; }

  .task-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .task-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    transform: rotate(-1deg);
    border: 1px solid currentColor;
  }
  .badge.p-high { color: var(--red); background: var(--red-dim); }
  .badge.p-medium { color: var(--amber); background: var(--amber-dim); }
  .badge.p-low { color: var(--blue); background: var(--blue-dim); }

  .task-cat {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .task-text {
    font-size: 15px;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .task-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .task-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .task-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .task-actions button {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--text-muted);
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .task-actions button.done-btn { color: var(--text); border-color: var(--hairline); }
  .task-actions button.star-btn.active { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
  .task-actions button:active { transform: scale(0.96); }

  .task.mit { box-shadow: 0 0 0 1px var(--amber); }

  .mit-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 8px;
  }
  .mit-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .mit-stats-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding: 2px;
  }
  .mit-stats-line strong { color: var(--amber); font-weight: 600; }

  .empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 30px 10px;
    border: 1px dashed var(--hairline);
    border-radius: 8px;
  }

  .grading {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    padding: 4px 2px;
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--hairline);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* FLOATING ROUNDUP BAR */
  .roundup-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .roundup-btn {
    width: 100%;
    max-width: 448px;
    padding: 15px;
    border: 1px solid var(--amber);
    border-radius: 10px;
    background: var(--surface-raised);
    color: var(--amber);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .roundup-btn.speaking { background: var(--amber-dim); }
  .roundup-btn:active { transform: scale(0.98); }

  .focus-btn {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-dim);
  }
  .focus-btn.speaking { background: var(--red); color: #15161A; }

  .bar-row { display: flex; gap: 8px; width: 100%; max-width: 448px; }
  .bar-row .roundup-btn { flex: 1; }

  .task-flags {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .flag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--text-muted);
    border: 1px solid var(--hairline);
  }
  .flag.due-soon { color: var(--red); border-color: var(--red); }
  .flag.aging { color: var(--amber); border-color: var(--amber); }

  @keyframes flash-highlight {
    0%, 100% { box-shadow: none; }
    50% { box-shadow: 0 0 0 2px var(--red); }
  }
  .task.flash { animation: flash-highlight 0.8s ease-in-out 2; }

  .footer-links {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
  }
  .footer-links button {
    background: none;
    border: none;
    color: var(--text-muted);
    text-decoration: underline;
    font-size: 11px;
    cursor: pointer;
    padding: 4px;
  }

  .endday-btn {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 11px;
    border: 1px dashed var(--blue) !important;
    border-radius: 8px;
    background: var(--blue-dim);
    color: var(--blue) !important;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-decoration: none !important;
    cursor: pointer;
  }
  .endday-btn:active { transform: scale(0.98); }
</style>
</head>
<body>

  <header>
    <h1>Site Log</h1>
    <span class="date" id="dateLabel"></span>
  </header>

  <div class="capture">
    <div class="hint" id="captureHint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      Say it as: "category X" high/medium/low "task ..."
    </div>
    <textarea id="taskInput" placeholder="e.g. category Stripping high task level 12 needs checking before we pour"></textarea>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="log-btn" id="logBtn" style="margin-top:0;">Log It</button>
      <button class="log-btn" id="cancelEditBtn" style="margin-top:0; display:none; flex:0 0 auto; background:var(--surface-raised); color:var(--text-muted); border:1px solid var(--hairline);">Cancel</button>
    </div>
  </div>


  <div id="mitStrip" style="display:none;"></div>
  <div id="mitStats" style="display:none;"></div>

  <div class="view-tabs" id="viewTabs">
    <button class="chip active" data-view="active">Outstanding</button>
    <button class="chip" data-view="cached">Cached</button>
    <button class="chip" data-view="done">Completed</button>
  </div>
  <div class="section-label">
    <span id="sectionLabel">Outstanding</span>
    <span id="outstandingCount">0</span>
  </div>
  <div class="category-filter" id="categoryFilter"></div>
  <div class="task-list" id="taskList"></div>

  <div class="footer-links">
    <button class="endday-btn" id="endDayBtn">End Day — Cache the Rest</button>
  </div>

  <div class="roundup-bar">
    <div class="bar-row">
      <button class="roundup-btn focus-btn" id="refocusBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        Refocus
      </button>
      <button class="roundup-btn" id="roundupBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        List
      </button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'tasks';
  const ARCHIVE_KEY = 'completedArchive';
  const MIT_CACHE_LOG_KEY = 'mitCacheLog';
  let tasks = [];
  let taskCounter = 1;
  let editingId = null;
  let selectedCategory = 'All';
  let viewMode = 'active'; // 'active' | 'cached' | 'done'

  const taskInput = document.getElementById('taskInput');
  const logBtn = document.getElementById('logBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const captureHint = document.getElementById('captureHint');
  const taskList = document.getElementById('taskList');
  const categoryFilter = document.getElementById('categoryFilter');
  const outstandingCount = document.getElementById('outstandingCount');
  const sectionLabel = document.getElementById('sectionLabel');
  const roundupBtn = document.getElementById('roundupBtn');
  const refocusBtn = document.getElementById('refocusBtn');
  const viewTabs = document.getElementById('viewTabs');
  const endDayBtn = document.getElementById('endDayBtn');
  const mitStrip = document.getElementById('mitStrip');
  const mitStats = document.getElementById('mitStats');

  let archive = [];       // permanent record of completed tasks — never cleared
  let mitCacheLog = [];   // permanent record of starred MITs that got parked instead of finished

  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });

  // Storage layer: Claude's window.storage only exists inside Claude's own
  // interface. Opened standalone (WhatsApp, Downloads, home screen icon),
  // that API isn't there at all, so we fall back to the browser's own
  // localStorage — which is what actually persists in that scenario.
  const hasClaudeStorage = typeof window.storage !== 'undefined';

  async function storageGet(key) {
    if (hasClaudeStorage) {
      try { return await window.storage.get(key); } catch (e) { /* fall through to localStorage */ }
    }
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? { key, value: raw } : null;
    } catch (e) {
      return null;
    }
  }

  async function storageSet(key, value) {
    if (hasClaudeStorage) {
      try { return await window.storage.set(key, value); } catch (e) { /* fall through to localStorage */ }
    }
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  }

  async function loadTasks() {
    try {
      const result = await storageGet(STORAGE_KEY);
      tasks = result ? JSON.parse(result.value) : [];
    } catch (e) {
      tasks = [];
    }
    tasks.forEach(t => {
      if (t.category) t.category = titleCase(t.category);
      if (typeof t.cached === 'undefined') t.cached = false;
      if (typeof t.mit === 'undefined') t.mit = false;
      if (t.cached && !t.cachedAt) t.cachedAt = t.createdAt;
    });
    taskCounter = tasks.length ? Math.max(...tasks.map(t => t.num)) + 1 : 1;
    render();
  }

  async function saveTasks() {
    try {
      await storageSet(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      console.error('Save failed', e);
    }
  }

  // Archive and MIT-cache log are permanent — never wiped by End Day.
  // They exist purely to look back on: what got finished, and whether
  // starred priorities actually get done or just keep getting parked.
  async function loadArchives() {
    try {
      const a = await storageGet(ARCHIVE_KEY);
      archive = a ? JSON.parse(a.value) : [];
    } catch (e) { archive = []; }
    try {
      const m = await storageGet(MIT_CACHE_LOG_KEY);
      mitCacheLog = m ? JSON.parse(m.value) : [];
    } catch (e) { mitCacheLog = []; }
  }

  async function appendArchive(entry) {
    archive.unshift(entry);
    try { await storageSet(ARCHIVE_KEY, JSON.stringify(archive)); } catch (e) { console.error('Archive save failed', e); }
  }

  async function appendMitCacheLog(entry) {
    mitCacheLog.unshift(entry);
    try { await storageSet(MIT_CACHE_LOG_KEY, JSON.stringify(mitCacheLog)); } catch (e) { console.error('MIT log save failed', e); }
  }

  const SEED_CATEGORIES = ['Safety', 'Programme', 'Variation', 'Admin', 'Other'];

  function titleCase(str) {
    return str.trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  }

  function getKnownCategories() {
    const seen = new Map();
    SEED_CATEGORIES.forEach(c => seen.set(c.toLowerCase(), c));
    tasks.forEach(t => { if (t.category && !seen.has(t.category.toLowerCase())) seen.set(t.category.toLowerCase(), t.category); });
    return Array.from(seen.values());
  }

  function normalizeCategory(raw, known) {
    const lower = raw.toLowerCase();
    const match = known.find(c => c.toLowerCase() === lower);
    return match || titleCase(raw);
  }

  // Detects spoken "category <word>" and "task <phrase>" tags, plus bare high/medium/low
  // as direct priority triggers, anywhere in the sentence and in any order.
  function stripPunct(w) {
    return w.replace(/^[.,!?;:'"()]+|[.,!?;:'"()]+$/g, '');
  }

  function extractVoiceTags(text) {
    const PRIORITY_ALIASES = { high: 'high', medium: 'medium', med: 'medium', low: 'low' };
    const KEYWORDS = ['category', 'task', ...Object.keys(PRIORITY_ALIASES)];
    const re = new RegExp(`\\b(${KEYWORDS.join('|')})\\b`, 'gi');
    const hits = [];
    let m;
    while ((m = re.exec(text)) !== null) {
      hits.push({ kw: m[1].toLowerCase(), start: m.index, contentStart: m.index + m[0].length });
    }

    if (hits.length === 0) return { category: null, priority: null, taskText: text.trim() };

    hits.forEach((h, i) => {
      const end = i + 1 < hits.length ? hits[i + 1].start : text.length;
      h.payload = text.slice(h.contentStart, end).replace(/^[\s,.\-–—:]+|[\s,.\-–—:]+$/g, '').trim();
    });

    const preamble = text.slice(0, hits[0].start).trim();
    let category = null, priority = null;
    const taskParts = preamble ? [preamble] : [];

    hits.forEach(h => {
      if (h.kw === 'category' && category === null) {
        const words = h.payload.split(/\s+/).filter(Boolean);
        const rawFirst = words.shift() || null;
        category = rawFirst ? stripPunct(rawFirst) : null;
        if (words.length) taskParts.push(words.join(' '));
      } else if (PRIORITY_ALIASES[h.kw] !== undefined) {
        if (priority === null) priority = PRIORITY_ALIASES[h.kw];
        if (h.payload) taskParts.push(h.payload);
      } else if (h.kw === 'task') {
        if (h.payload) taskParts.push(h.payload);
      }
    });

    const taskText = taskParts.join(' ').replace(/\s{2,}/g, ' ').trim();
    return { category, priority, taskText: taskText || text.trim() };
  }

  // Backup date detector: catches "today" / "tomorrow" / weekday names locally,
  // in case the AI's own due-date extraction misses an obvious mention.
  function localDueDateGuess(text) {
    const lower = text.toLowerCase();
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const fmt = d => d.toISOString().slice(0, 10);
    if (/\btoday\b/.test(lower)) return fmt(today);
    if (/\btomorrow\b/.test(lower)) {
      const d = new Date(today); d.setDate(d.getDate() + 1); return fmt(d);
    }
    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    for (let i = 0; i < days.length; i++) {
      if (new RegExp(`\\b${days[i]}\\b`).test(lower)) {
        const d = new Date(today);
        let diff = (i - d.getDay() + 7) % 7;
        if (diff === 0) diff = 7;
        d.setDate(d.getDate() + diff);
        return fmt(d);
      }
    }
    return null;
  }

  // Deadline-driven escalation: due within 2 days -> high, within 4 days -> medium.
  // Only ever escalates — never used to downgrade a priority the AI or the user set.
  function priorityFromDueDate(dueDate) {
    if (!dueDate) return null;
    const due = new Date(dueDate + 'T23:59:59');
    const daysLeft = daysBetween(due, new Date());
    if (daysLeft <= 2) return 'high';
    if (daysLeft <= 4) return 'medium';
    return null;
  }

  // Light local cleanup of the dictated text: trim, collapse spaces, capitalize
  // the first letter. No AI call — you're grading via voice tags yourself.
  function cleanSummary(text) {
    const trimmed = text.trim().replace(/\s{2,}/g, ' ');
    if (!trimmed) return trimmed;
    return trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
  }

  const BASE_WEIGHT = { high: 40, medium: 25, low: 10 };
  const SAFETY_WEIGHT = 20;       // strong, but a close hard deadline elsewhere can still outscore it
  const STALE_GRACE_DAYS = 2;     // moderate escalation: starts after 2-3 unactioned days
  const STALE_PER_DAY = 8;
  const STALE_CAP = 40;

  function daysBetween(a, b) {
    return Math.floor((a - b) / 86400000);
  }

  function deadlineScore(dueDate) {
    if (!dueDate) return 0;
    const due = new Date(dueDate + 'T23:59:59');
    const daysLeft = daysBetween(due, new Date());
    if (daysLeft <= 0) return 70;   // overdue or due today
    if (daysLeft === 1) return 45;  // due tomorrow
    if (daysLeft === 2) return 30;
    if (daysLeft <= 4) return 15;
    return 0;
  }

  function stalenessScore(createdAt) {
    const ageDays = daysBetween(new Date(), new Date(createdAt));
    if (ageDays <= STALE_GRACE_DAYS) return 0;
    return Math.min(STALE_CAP, (ageDays - STALE_GRACE_DAYS) * STALE_PER_DAY);
  }

  function computeScore(task) {
    let score = BASE_WEIGHT[task.priority] || 20;
    if ((task.category || '').toLowerCase() === 'safety') score += SAFETY_WEIGHT;
    score += deadlineScore(task.dueDate);
    score += stalenessScore(task.createdAt);
    return score;
  }

  function sortByScore(list) {
    return [...list].sort((a, b) => computeScore(b) - computeScore(a) || new Date(a.createdAt) - new Date(b.createdAt));
  }

  function formatDueDate(dueDate) {
    if (!dueDate) return '';
    const due = new Date(dueDate + 'T00:00:00');
    const daysLeft = daysBetween(due, new Date());
    const label = due.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
    if (daysLeft < 0) return `Overdue — was ${label}`;
    if (daysLeft === 0) return `Due today`;
    if (daysLeft === 1) return `Due tomorrow`;
    return `Due ${label}`;
  }

  function timeAgo(iso) {
    const diffMin = Math.round((Date.now() - new Date(iso)) / 60000);
    if (diffMin < 1) return 'just now';
    if (diffMin < 60) return `${diffMin}m ago`;
    const diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return `${diffHr}h ago`;
    return `${Math.round(diffHr / 24)}d ago`;
  }

  function renderCategoryChips(pool) {
    if (pool.length === 0) { categoryFilter.innerHTML = ''; return; }
    const counts = {};
    pool.forEach(t => { counts[t.category] = (counts[t.category] || 0) + 1; });
    if (selectedCategory !== 'All' && !counts[selectedCategory]) selectedCategory = 'All';
    const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const chips = [`<button class="chip ${selectedCategory === 'All' ? 'active' : ''}" data-category="All">All (${pool.length})</button>`]
      .concat(cats.map(c => `<button class="chip ${selectedCategory === c ? 'active' : ''}" data-category="${escapeHtml(c)}">${escapeHtml(c)} (${counts[c]})</button>`));
    categoryFilter.innerHTML = chips.join('');
  }

  function renderMitStrip(mits) {
    if (mits.length === 0) {
      mitStrip.style.display = 'none';
      mitStrip.innerHTML = '';
      return;
    }
    mitStrip.style.display = 'block';
    mitStrip.innerHTML = `
      <div class="mit-label">★ Today's MITs — ${mits.length}/3</div>
      <div class="mit-list">
        ${mits.map(t => `
        <div class="task mit p-${t.priority}" data-task-id="${t.id}">
          <div class="task-top">
            <span class="task-id">T-${String(t.num).padStart(3,'0')}</span>
            <span class="badge p-${t.priority}">${t.priority}</span>
            <span class="task-cat">${escapeHtml(t.category)}</span>
          </div>
          <div class="task-text">${escapeHtml(t.summary)}</div>
          <div class="task-bottom">
            <span class="task-time">${timeAgo(t.createdAt)}</span>
            <div class="task-actions">
              <button data-id="${t.id}" data-action="edit">Edit</button>
              <button class="done-btn" data-id="${t.id}" data-action="toggle">Complete</button>
              <button class="star-btn active" data-id="${t.id}" data-action="star">★ Unstar</button>
            </div>
          </div>
        </div>`).join('')}
      </div>
    `;
  }

  function renderMitStats() {
    const cutoff = Date.now() - 7 * 86400000;
    const completedMits = archive.filter(e => e.wasMit && new Date(e.completedAt).getTime() >= cutoff).length;
    const parkedMits = mitCacheLog.filter(e => new Date(e.closedAt).getTime() >= cutoff).length;
    if (completedMits === 0 && parkedMits === 0) {
      mitStats.style.display = 'none';
      mitStats.innerHTML = '';
      return;
    }
    mitStats.style.display = 'block';
    mitStats.innerHTML = `<div class="mit-stats-line">MITs, last 7 days: <strong>${completedMits} done</strong>${parkedMits ? ` · ${parkedMits} parked without finishing` : ''}</div>`;
  }

  function render() {
    const active = sortByScore(tasks.filter(t => !t.done && !t.cached));
    const cached = tasks.filter(t => !t.done && t.cached).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const completed = tasks.filter(t => t.done).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const mits = active.filter(t => t.mit);

    renderMitStrip(mits);
    renderMitStats();

    const pools = { active, cached, done: completed };
    const labels = { active: 'Outstanding', cached: 'Cached', done: 'Completed' };
    const scopePool = pools[viewMode];

    sectionLabel.textContent = labels[viewMode];
    outstandingCount.textContent = scopePool.length;

    viewTabs.querySelectorAll('.chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === viewMode);
    });

    renderCategoryChips(scopePool);
    // MITs get their own pinned strip above, so leave them out of the
    // regular Outstanding list to avoid showing the same task twice.
    const listPool = viewMode === 'active' ? scopePool.filter(t => !t.mit) : scopePool;
    const visible = selectedCategory === 'All' ? listPool : listPool.filter(t => t.category === selectedCategory);

    const emptyMessages = {
      active: tasks.length === 0 ? 'No tasks logged yet. Speak your first one above.' : 'Nothing outstanding. Nicely clear.',
      cached: 'Nothing parked. Anything you Cache during the day, or carry over at End Day, lands here for your weekly review.',
      done: 'Nothing completed yet.'
    };

    if (visible.length === 0) {
      taskList.innerHTML = `<div class="empty">${selectedCategory !== 'All' ? `No ${selectedCategory} tasks here.` : emptyMessages[viewMode]}</div>`;
    } else {
      taskList.innerHTML = visible.map(t => {
        const stale = !t.done && !t.cached && stalenessScore(t.createdAt) > 0;
        const dueSoon = !t.done && t.dueDate && deadlineScore(t.dueDate) >= 30;
        const flags = [];
        if (t.dueDate) flags.push(`<span class="flag ${dueSoon ? 'due-soon' : ''}">${formatDueDate(t.dueDate)}</span>`);
        if (stale) flags.push(`<span class="flag aging">Aging — climbing in priority</span>`);
        if (t.cached) {
          const parkedDays = daysBetween(new Date(), new Date(t.cachedAt || t.createdAt));
          if (parkedDays >= 7) flags.push(`<span class="flag aging">Parked ${parkedDays}d — review</span>`);
        }

        let actionsHtml;
        if (t.done) {
          actionsHtml = `
              <button class="done-btn" data-id="${t.id}" data-action="toggle">Reopen</button>
              <button data-id="${t.id}" data-action="delete">Cull</button>`;
        } else if (t.cached) {
          actionsHtml = `
              <button class="done-btn" data-id="${t.id}" data-action="reactivate">Reactivate</button>
              <button data-id="${t.id}" data-action="delete">Cull</button>`;
        } else {
          actionsHtml = `
              <button data-id="${t.id}" data-action="edit">Edit</button>
              <button class="done-btn" data-id="${t.id}" data-action="toggle">Complete</button>
              <button class="star-btn" data-id="${t.id}" data-action="star">★ MIT</button>
              <button data-id="${t.id}" data-action="cache">Cache</button>
              <button data-id="${t.id}" data-action="delete">Cull</button>`;
        }

        return `
        <div class="task p-${t.priority} ${t.done ? 'done' : ''} ${t.cached ? 'cached' : ''}" data-task-id="${t.id}">
          <div class="task-top">
            <span class="task-id">T-${String(t.num).padStart(3,'0')}</span>
            <span class="badge p-${t.priority}">${t.priority}</span>
            <span class="task-cat">${escapeHtml(t.category)}</span>
          </div>
          <div class="task-text">${escapeHtml(t.summary)}</div>
          ${flags.length ? `<div class="task-flags">${flags.join('')}</div>` : ''}
          <div class="task-bottom">
            <span class="task-time">${timeAgo(t.createdAt)}</span>
            <div class="task-actions">${actionsHtml}
            </div>
          </div>
        </div>
      `;
      }).join('');
    }
  }

  categoryFilter.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    selectedCategory = btn.dataset.category;
    render();
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function handleTaskAction(action, id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    if (action === 'toggle') {
      const completing = !task.done;
      if (completing) {
        await appendArchive({
          id: task.id, num: task.num, summary: task.summary,
          category: task.category, priority: task.priority,
          wasMit: !!task.mit,
          createdAt: task.createdAt, completedAt: new Date().toISOString()
        });
      }
      task.done = !task.done;
      if (task.done) { task.cached = false; task.mit = false; }
      await saveTasks();
      render();
    } else if (action === 'cache') {
      if (task.mit) {
        await appendMitCacheLog({ summary: task.summary, category: task.category, closedAt: new Date().toISOString() });
      }
      task.cached = true;
      task.cachedAt = new Date().toISOString();
      task.mit = false;
      await saveTasks();
      render();
    } else if (action === 'reactivate') {
      task.cached = false;
      task.cachedAt = null;
      await saveTasks();
      render();
    } else if (action === 'star') {
      if (!task.mit) {
        const currentMits = tasks.filter(t => !t.done && !t.cached && t.mit).length;
        if (currentMits >= 3) {
          alert("You've already got 3 MITs today. Unstar one first — that's the point.");
          return;
        }
      }
      task.mit = !task.mit;
      await saveTasks();
      render();
    } else if (action === 'delete') {
      tasks = tasks.filter(t => t.id !== id);
      await saveTasks();
      render();
    } else if (action === 'edit') {
      startEdit(task);
    }
  }

  taskList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    handleTaskAction(btn.dataset.action, btn.dataset.id);
  });

  mitStrip.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    handleTaskAction(btn.dataset.action, btn.dataset.id);
  });

  function startEdit(task) {
    editingId = task.id;
    taskInput.value = task.summary;
    taskInput.focus();
    logBtn.textContent = 'Save Correction';
    cancelEditBtn.style.display = 'block';
    captureHint.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg> Editing T-${String(task.num).padStart(3,'0')} — clear and re-speak, or type the fix`;
    document.querySelector('.capture').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function endEdit() {
    editingId = null;
    taskInput.value = '';
    logBtn.textContent = 'Log It';
    cancelEditBtn.style.display = 'none';
    captureHint.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg> Say it as: "category X" high/medium/low "task ..."`;
  }

  cancelEditBtn.addEventListener('click', endEdit);

  viewTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    viewMode = btn.dataset.view;
    selectedCategory = 'All';
    render();
  });

  // End Day: the daily 2-min close. Completed tasks are done, so they clear
  // entirely. Anything still active gets bulk-parked into Cache — nothing
  // requires a decision right now, but nothing gets lost either. Site Log
  // itself opens empty again next time you capture something.
  endDayBtn.addEventListener('click', async () => {
    const activeCount = tasks.filter(t => !t.done && !t.cached).length;
    const doneCount = tasks.filter(t => t.done).length;

    if (activeCount === 0 && doneCount === 0) {
      alert('Nothing to clear — Site Log is already empty for tomorrow.');
      return;
    }

    const ok = confirm(
      `End day:\n– Clear ${doneCount} completed task${doneCount === 1 ? '' : 's'}\n– Cache ${activeCount} outstanding task${activeCount === 1 ? '' : 's'}\n\nSite Log opens empty next time. Cached items wait for your weekly review. Continue?`
    );
    if (!ok) return;

    tasks = tasks.filter(t => !t.done);
    for (const t of tasks) {
      if (t.mit) {
        await appendMitCacheLog({ summary: t.summary, category: t.category, closedAt: new Date().toISOString() });
      }
      if (!t.cached) t.cachedAt = new Date().toISOString();
      t.cached = true;
      t.mit = false;
    }
    await saveTasks();

    viewMode = 'active';
    selectedCategory = 'All';
    render();
  });

  logBtn.addEventListener('click', () => {
    const rawText = taskInput.value.trim();
    if (!rawText) return;

    const { category: explicitCategory, priority: explicitPriority, taskText } = extractVoiceTags(rawText);
    const text = taskText;
    const known = getKnownCategories();

    const isEdit = !!editingId;

    const finalCategory = explicitCategory ? normalizeCategory(explicitCategory, known) : 'Other';
    const resolvedDueDate = localDueDateGuess(text);
    const finalPriority = explicitPriority || priorityFromDueDate(resolvedDueDate) || 'medium';

    const fields = {
      summary: cleanSummary(text),
      priority: finalPriority,
      category: finalCategory,
      dueDate: resolvedDueDate
    };

    if (isEdit) {
      const task = tasks.find(t => t.id === editingId);
      if (task) Object.assign(task, fields);
    } else {
      tasks.unshift({
        id: crypto.randomUUID(),
        num: taskCounter++,
        ...fields,
        done: false,
        cached: false,
        cachedAt: null,
        mit: false,
        createdAt: new Date().toISOString()
      });
    }

    saveTasks();
    endEdit();
    render();
  });

  roundupBtn.addEventListener('click', () => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      roundupBtn.classList.remove('speaking');
      return;
    }

    const outstanding = sortByScore(tasks.filter(t => !t.done));

    if (outstanding.length === 0) {
      const u = new SpeechSynthesisUtterance("You have no outstanding tasks.");
      window.speechSynthesis.speak(u);
      return;
    }

    // Group by category, preserving the score-sorted order within each group,
    // and ordering categories by the priority of their top task.
    const grouped = {};
    const order = [];
    outstanding.forEach(t => {
      if (!grouped[t.category]) { grouped[t.category] = []; order.push(t.category); }
      grouped[t.category].push(t);
    });

    let script = `You have ${outstanding.length} outstanding task${outstanding.length > 1 ? 's' : ''}, across ${order.length} categor${order.length > 1 ? 'ies' : 'y'}. `;
    order.forEach(cat => {
      script += `${cat}: `;
      grouped[cat].forEach(t => { script += `${t.summary}. `; });
    });

    const utterance = new SpeechSynthesisUtterance(script);
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.onstart = () => roundupBtn.classList.add('speaking');
    utterance.onend = () => roundupBtn.classList.remove('speaking');
    window.speechSynthesis.speak(utterance);
  });

  refocusBtn.addEventListener('click', () => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      refocusBtn.classList.remove('speaking');
      return;
    }

    const outstanding = sortByScore(tasks.filter(t => !t.done));

    if (outstanding.length === 0) {
      const u = new SpeechSynthesisUtterance("Nothing outstanding. You're clear.");
      refocusBtn.classList.add('speaking');
      u.onend = () => refocusBtn.classList.remove('speaking');
      window.speechSynthesis.speak(u);
      return;
    }

    const top = outstanding[0];
    const utterance = new SpeechSynthesisUtterance(`Your priority right now: ${top.summary}`);
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.onstart = () => refocusBtn.classList.add('speaking');
    utterance.onend = () => refocusBtn.classList.remove('speaking');
    window.speechSynthesis.speak(utterance);

    render();
    const card = taskList.querySelector(`[data-task-id="${top.id}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 1700);
    }
  });

  (async () => {
    await loadArchives();
    await loadTasks();
  })();
</script>
</body>
</html>
